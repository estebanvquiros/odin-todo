<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <title>Todinist</title>
</head>

<body>
  <div id="app">
    <div id="sidebar">
      <div id="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path
            d="M20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4C12.76,4 13.5,4.11 14.2,4.31L15.77,2.74C14.61,2.26 13.34,2 12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12M7.91,10.08L6.5,11.5L11,16L21,6L19.59,4.58L11,13.17L7.91,10.08Z" />
        </svg>
        <h1>todinist</h1>
      </div>
      <span class="sidebar-label">Projects</span>
      <ul class="sidebar-list" id="project-list"></ul>
      <div class="sidebar-item" id="create-project-btn">
        <span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <title>plus</title>
            <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
          </svg>
        </span>
        <p>Add project</p>
      </div>
    </div>
    <div id="main">
      <div id="content">
        <div id="header">
          <h1 id="header-title">Project</h1>
          <button id="project-edit-btn" class="square-btn" title="Edit project"><svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24">
              <title>square-edit-outline</title>
              <path
                d="M5,3C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V12H19V19H5V5H12V3H5M17.78,4C17.61,4 17.43,4.07 17.3,4.2L16.08,5.41L18.58,7.91L19.8,6.7C20.06,6.44 20.06,6 19.8,5.75L18.25,4.2C18.12,4.07 17.95,4 17.78,4M15.37,6.12L8,13.5V16H10.5L17.87,8.62L15.37,6.12Z" />
            </svg></button>
        </div>
        <div id="divider"></div>
        <ul id="task-list">
        </ul>
        <div id="add-task-btn">
          <span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <title>plus</title>
              <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
            </svg>
          </span>
          <p>Add new task</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Dialogs -->
  <dialog id="project-dialog">
    <div>
      <h1 id="project-dialog-title"></h1>
      <form id="project-form">
        <div>
          <label for="project-name-input">Project name:</label>
          <input type="text" id="project-name-input" maxlength="30" required>
          <p id="project-name-error-msg" class="error-msg hidden">Error message</p>
        </div>
      </form>
      <div id="dialog-buttons">
        <button type="submit" form="project-form" class="btn confirm-btn" id="project-submit-btn"></button>
        <button id="project-delete-btn" class="btn destructive-btn">Delete Project</button>
        <button id="project-cancel-btn" class="btn cancel-btn">Cancel</button>
      </div>
    </div>
  </dialog>

  <dialog id="task-dialog">
    <div>
      <h1 id="task-dialog-title">New Task</h1>
      <form id="task-form">
        <div>
          <label for="task-title-input">Title:</label>
          <input type="text" id="task-title-input" required>
        </div>
        <div>
          <label for="task-description-input">Description:</label>
          <textarea id="task-description-input" rows="5"></textarea>
        </div>
        <div>
          <label for="task-date-input">Due date:</label>
          <input type="date" id="task-date-input">
        </div>
        <div>
          <label for="task-priority-input">Priority</label>
          <select id="task-priority-input">
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low" selected>Low</option>
          </select>
        </div>
      </form>
      <div id="dialog-buttons">
        <button id="task-submit-btn" type="submit" form="task-form" class="btn confirm-btn">Create task</button>
        <button id="task-delete-btn" class="btn destructive-btn">Delete Task</button>
        <button id="task-cancel-btn" class="btn cancel-btn">Cancel</button>
      </div>
    </div>
  </dialog>

</body>

</html>
