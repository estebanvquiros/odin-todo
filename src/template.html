<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <title>Todinist</title>
</head>

<body>
  <div id="app">
    <div id="sidebar">
      <div id="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path
            d="M20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4C12.76,4 13.5,4.11 14.2,4.31L15.77,2.74C14.61,2.26 13.34,2 12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12M7.91,10.08L6.5,11.5L11,16L21,6L19.59,4.58L11,13.17L7.91,10.08Z" />
        </svg>
        <h1>todinist</h1>
      </div>
      <span class="sidebar-label">Projects</span>
      <ul class="sidebar-list" id="projects"></ul>
      <div class="sidebar-item" id="new-project-btn">
        <span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>plus</title><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
        </span>
        <p>Add project</p>
      </div>
    </div>
    <div id="main-content">
    </div>
  </div>

  <!-- Dialogs -->
  <dialog id="project-dialog">
    <div>
      <h1>New Project</h1>
      <form id="project-form">
        <label for="project-name-input">Project name:</label>
        <input type="text" id="project-name-input" required>
      </form>
      <div id="dialog-buttons">
        <button type="submit" form="project-form" class="btn confirm-btn">Create project</button>
        <button id="project-cancel-btn" class="btn cancel-btn">Cancel</button>
      </div>
    </div>
  </dialog>

</body>

</html>
